[project]
name = "automl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.39.0",
    "xgboost>=3.2.0",
]

[project.scripts]
automl = "automl:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
